  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            },
          },
          boxShadow: {
            soft: '0 4px 24px -8px rgba(79, 70, 229, 0.18)',

  <style>
    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      overscroll-behavior-y: contain;
    }
    body {
      padding-top: env(safe-area-inset-top);
    }
    button, a, [role="button"] { touch-action: manipulation; }
    button { -webkit-appearance: none; }
    /* Prevent iOS auto-zoom on inputs (font >= 16px) — currently no inputs but future-proof */
    input, select, textarea { font-size: 16px; }
    /* Bottom sticky action bar that respects iPhone home indicator */
    .sticky-actions {
      position: sticky;
      bottom: 0;
      background: linear-gradient(180deg, rgba(248,250,252,0) 0%, rgba(248,250,252,0.95) 30%, rgba(248,250,252,1) 100%);
      padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
      margin-top: 16px;
      z-index: 20;
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .ipa { font-family: 'Inter', sans-serif; letter-spacing: 0.02em; }
    .flip-card { perspective: 1200px; }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(.22,.84,.42,1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backfaceVisibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      border-radius: 1.25rem;
    }
    .flip-back { transform: rotateY(180deg); }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .pulse-ring::after {
      content: ''; position: absolute; inset: 0;
      border-radius: 9999px; border: 2px solid currentColor;
      animation: pulseRing 1.4s ease-out infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.32s ease-out both; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 3px; }
    .progress-bar { transition: width 0.6s cubic-bezier(.22,.84,.42,1); }
    .option-btn { transition: all 0.18s ease; }
    .option-btn:hover { transform: translateY(-1px); }
    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
  </style>
</head>

  const GRAMMAR_LESSONS = {
    'be-verb': {
      id: 'be-verb',

      sections: [
        {
          heading: '基本規則',
          html: `
            <p class="mb-3">be 動詞用來描述「<b>是什麼</b>」「<b>在哪裡</b>」「<b>狀態如何</b>」。形式由主詞決定：</p>
            <table class="w-full text-sm border border-slate-200 rounded-lg overflow-hidden mb-3">
              <thead class="bg-slate-50 text-slate-600">
                <tr><th class="p-2 text-left">主詞</th><th class="p-2 text-left">be 動詞</th><th class="p-2 text-left">縮寫</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <tr><td class="p-2"><code>I</code></td><td class="p-2"><b>am</b></td><td class="p-2">I'm</td></tr>
                <tr><td class="p-2"><code>He / She / It</code> · 單一人事物</td><td class="p-2"><b>is</b></td><td class="p-2">He's / She's / It's</td></tr>
                <tr><td class="p-2"><code>You / We / They</code> · 多個人事物</td><td class="p-2"><b>are</b></td><td class="p-2">You're / We're / They're</td></tr>

  // ============================================================
  //  STATE / STORAGE
  // ============================================================

  const STORAGE_KEY = 'toeic-academy-state-v1';

  function defaultState() {
    return {
      startDate: new Date().toISOString().slice(0, 10),
      currentDay: 1,
      streak: 0,
      lastStudyDate: null,
      lastQuizDate: null,
      lastLessonEndTime: null,
      vocabStats: {},
      questionStats: {},
      topicStats: {},
      reviewQueue: [],
      history: [],
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return { ...defaultState(), ...parsed };
    } catch (e) {
      return defaultState();
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ============================================================
  //  ADAPTIVE ENGINE — pull review items into today's session
  // ============================================================

  function buildTodaySession(state, day) {
    const plan = CURRICULUM[day] || CURRICULUM[1];

    // Vocab: today's new words + 5 weakest old words (mastery < 4)
    const newVocab = plan.vocab.map(w => VOCABULARY[w]).filter(Boolean);
    const olderWeakWords = Object.entries(state.vocabStats)
      .filter(([w, s]) => !plan.vocab.includes(w) && (s.mastery || 0) < 4)
      .sort((a, b) => (a[1].mastery || 0) - (b[1].mastery || 0))
      .slice(0, 5)
      .map(([w]) => VOCABULARY[w])
      .filter(Boolean);
    const vocabList = [...newVocab, ...olderWeakWords];

    // Questions: today's planned + up to 5 from review queue (wrong before)
    const planned = plan.questions.map(qid => QUESTIONS.find(q => q.id === qid)).filter(Boolean);
    const reviewIds = Array.from(new Set(state.reviewQueue || [])).slice(0, 5);
    const reviewQs = reviewIds
      .map(qid => QUESTIONS.find(q => q.id === qid))
      .filter(Boolean)
      .filter(q => !planned.find(p => p.id === q.id)); // dedupe
    const questions = [...planned, ...reviewQs];

    return {
      day,
      title: plan.title,
      grammar: plan.grammar.map(g => GRAMMAR_LESSONS[g]).filter(Boolean),
      vocab: vocabList,
      reviewVocabCount: olderWeakWords.length,
      questions,
      reviewQuestionCount: reviewQs.length,
    };
  }

  function applyAnswerOutcome(state, q, isCorrect) {
    const next = { ...state };
    next.questionStats = { ...state.questionStats };
    next.vocabStats = { ...state.vocabStats };
    next.topicStats = { ...state.topicStats };
    next.reviewQueue = [...(state.reviewQueue || [])];

    // question stats
    const qs = next.questionStats[q.id] || { attempts: 0, correct: 0, wrong: 0, lastSeen: null };
    qs.attempts += 1;
    if (isCorrect) qs.correct += 1; else qs.wrong += 1;
    qs.lastSeen = new Date().toISOString();
    next.questionStats[q.id] = qs;

    // topic stats
    const ts = next.topicStats[q.topic] || { correct: 0, wrong: 0, confidence: 50 };
    if (isCorrect) {
      ts.correct += 1;
      ts.confidence = Math.min(100, ts.confidence + 6);
    } else {
      ts.wrong += 1;
      ts.confidence = Math.max(0, ts.confidence - 10);
    }
    next.topicStats[q.topic] = ts;

    // vocab stats — bump related words
    (q.vocab || []).forEach(w => {
      const v = next.vocabStats[w] || { mastery: 0, seen: 0, correct: 0, wrong: 0, lastSeen: null };
      v.seen += 1;
      v.lastSeen = new Date().toISOString();
      if (isCorrect) {
        v.correct += 1;
        v.mastery = Math.min(5, v.mastery + 1);
      } else {
        v.wrong += 1;
        v.mastery = Math.max(0, v.mastery - 1);
      }
      next.vocabStats[w] = v;
    });

    // review queue
    if (!isCorrect) {
      if (!next.reviewQueue.includes(q.id)) next.reviewQueue.push(q.id);
    } else {
      // remove from queue once answered correctly
      next.reviewQueue = next.reviewQueue.filter(id => id !== q.id);
    }

    return next;
  }

  function recordSessionComplete(state, day, correct, total, durationSec) {
    const today = new Date().toISOString().slice(0, 10);
    const last = state.lastStudyDate;
    let streak = state.streak || 0;
    if (last === today) {
      // already counted today, no change
    } else {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      streak = last === yesterday ? streak + 1 : 1;
    }
    return {
      ...state,
      lastStudyDate: today,
      lastLessonEndTime: Date.now(),
      streak,
      currentDay: Math.max(state.currentDay, day + 1),
      history: [...state.history, { date: today, day, correct, total, durationSec: durationSec || 0, ts: Date.now() }],
    };
  }

  // ============================================================
  //  SMART SUGGESTIONS — context-aware quiz prompts
  // ============================================================

  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function yesterdayStr() { return new Date(Date.now() - 86400000).toISOString().slice(0, 10); }

  function getSuggestion(state) {
    const pool = getQuizPool(state);
    if (pool.length < 4) return null;

    const today = todayStr();
    const dayOfWeek = new Date().getDay(); // 0 = Sunday
    const quizzedToday = state.lastQuizDate === today;
    if (quizzedToday) return null; // don't nag if they've already quizzed today

    // Priority 1: just completed a lesson (within 30 min)
    const POST_LESSON_WINDOW = 30 * 60 * 1000;
    if (state.lastLessonEndTime && Date.now() - state.lastLessonEndTime < POST_LESSON_WINDOW) {
      const count = Math.min(5, pool.length);
      return {
        type: 'post-lesson',
        icon: '🎉',
        title: '剛學完，趁熱再試一下！',
        subtitle: '把剛才的單字鎖進記憶',
        message: `${count} 題隨機抽考，1 分鐘搞定`,
        count,
        primaryLabel: `🎯 開始 ${count} 題快考`,
        gradient: 'from-emerald-500 to-teal-600',
      };
    }

    // Priority 2: it's Sunday + they have ≥10 words → total review
    if (dayOfWeek === 0 && pool.length >= 10) {
      return {
        type: 'sunday',
        icon: '📅',
        title: '今天是週日 · 總複習日',
        subtitle: `把這週累積的 ${pool.length} 個單字一次考完`,
        message: '答錯的字會被標記，下週優先加強',
        count: pool.length,
        primaryLabel: `🎯 開始 ${pool.length} 題總複習`,
        gradient: 'from-violet-600 to-purple-700',
      };
    }

    // Priority 3: yesterday studied → quick recap before today's lesson
    if (state.lastStudyDate === yesterdayStr() && pool.length >= 10) {
      const count = Math.min(10, pool.length);
      return {
        type: 'yesterday',
        icon: '🔄',
        title: '昨天學的還記得嗎？',
        subtitle: '開始今天的課之前，先快速回顧',
        message: `${count} 題複習昨天的重點單字`,
        count,
        primaryLabel: `🎯 開始 ${count} 題複習`,
        gradient: 'from-amber-500 to-orange-600',
      };
    }

    return null;
  }

  // ============================================================
  //  VOCAB QUIZ — random sampling weighted by mastery
  // ============================================================

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getQuizPool(state) {
    return Object.keys(state.vocabStats).filter(w => VOCABULARY[w]);
  }

  function generateQuiz(state, count) {
    const pool = getQuizPool(state);
    if (pool.length < 4) return [];

    // Weight by inverse mastery — mastery 0 → weight 6, mastery 5 → weight 1
    const weighted = [];
    pool.forEach(w => {
      const m = state.vocabStats[w].mastery || 0;
      const weight = Math.max(1, 6 - m);
      for (let i = 0; i < weight; i++) weighted.push(w);
    });

    const chosen = new Set();
    const questions = [];
    let attempts = 0;
    while (questions.length < count && chosen.size < pool.length && attempts < 500) {
      attempts++;
      const w = weighted[Math.floor(Math.random() * weighted.length)];
      if (chosen.has(w)) continue;
      chosen.add(w);

      const direction = Math.random() < 0.5 ? 'enToZh' : 'zhToEn';
      const distractorPool = pool.filter(x => x !== w);
      const distractors = shuffle(distractorPool).slice(0, 3);
      const allWords = shuffle([w, ...distractors]);
      const optionsLabel = direction === 'enToZh'
        ? allWords.map(x => VOCABULARY[x].zh)
        : allWords.map(x => VOCABULARY[x].word);
      const answerIdx = allWords.indexOf(w);

      questions.push({
        id: `quiz-${Date.now()}-${questions.length}`,
        word: w,
        direction,
        prompt: direction === 'enToZh' ? VOCABULARY[w].word : VOCABULARY[w].zh,
        promptHint: direction === 'enToZh'
          ? `${VOCABULARY[w].ipa} · ${VOCABULARY[w].pos}`
          : '請選出對應的英文單字',
        options: optionsLabel,
        allWords,
        answer: answerIdx,
      });
    }
    return questions;
  }

  function applyQuizAnswer(state, q, isCorrect) {
    const next = { ...state };
    next.vocabStats = { ...state.vocabStats };
    const v = next.vocabStats[q.word] || { mastery: 0, seen: 0, correct: 0, wrong: 0, lastSeen: null };
    v.seen += 1;
    v.lastSeen = new Date().toISOString();
    if (isCorrect) {
      v.correct += 1;
      v.mastery = Math.min(5, v.mastery + 1);
    } else {
      v.wrong += 1;
      v.mastery = Math.max(0, v.mastery - 1);
    }
    next.vocabStats[q.word] = v;
    return next;
  }

  // ============================================================
  //  PRONUNCIATION (Web Speech API)
  // ============================================================
  // iOS 內建多顆英文語音，品質排序：Premium > Enhanced > Default。
  // 名字優先序：Ava / Samantha / Allison / Evan / Joelle 都是 Apple 高品質女聲／男聲。
  // 使用者需要先在 iPhone「設定 → 輔助使用 → 朗讀內容 → 聲音 → 英文」下載增強版／高品質版。

  let _cachedVoice = null;

  function pickBestEnglishVoice() {
    if (_cachedVoice) return _cachedVoice;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    const en = voices.filter(v => /^en[-_]/i.test(v.lang));
    if (en.length === 0) return null;

    // 名字優先序（前面的優先）—— 全部是女聲，由自然度排序
    const PREFERRED_NAMES = ['Ava', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Joelle', 'Karen', 'Moira'];

    const tierScore = (n) => {
      if (/premium/i.test(n)) return 3;
      if (/enhanced/i.test(n)) return 2;
      if (/siri/i.test(n)) return 1;
      return 0;
    };

    // 第一輪：在偏好名單中按順序挑（同名字之間取品質最高的 tier）
    for (const target of PREFERRED_NAMES) {
      const matches = en.filter(v => new RegExp('\\b' + target + '\\b', 'i').test(v.name || ''));
      if (matches.length > 0) {
        matches.sort((a, b) => tierScore(b.name) - tierScore(a.name));
        _cachedVoice = matches[0];
        return _cachedVoice;
      }
    }

    // 第二輪 fallback：偏好名單裡都沒有，挑任何 Premium/Enhanced 的英文女聲（盡量避開明顯男聲名字）
    const MALE_NAMES = /\b(Aaron|Albert|Alex|Daniel|Evan|Fred|Gordon|Lee|Oliver|Reed|Rishi|Rocko|Tom)\b/i;
    const fallback = en
      .filter(v => !MALE_NAMES.test(v.name || ''))
      .sort((a, b) => tierScore(b.name) - tierScore(a.name));
    _cachedVoice = fallback[0] || en[0];
    return _cachedVoice;
  }

  // 初始化：iOS Safari 第一次 getVoices() 通常回空陣列，要等 voiceschanged 事件
  if (typeof window !== 'undefined' && window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => {
      _cachedVoice = null; // 清掉 cache，下次 speak() 會重新挑
      pickBestEnglishVoice();
    };
    pickBestEnglishVoice();
  }

  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      const voice = pickBestEnglishVoice();
      if (voice) {
        u.voice = voice;
        u.lang = voice.lang;
      } else {
        u.lang = 'en-US';
      }
      u.rate = 0.9;
      u.pitch = 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  // ============================================================
  //  TUTOR REPORT — exportable progress snapshot for the human tutor
  // ============================================================

  function buildTutorReport(state) {
    const recentSession = state.history[state.history.length - 1];
    const allHistory = state.history.slice(-7); // last week

    const wrongQuestions = Object.entries(state.questionStats)
      .filter(([_, s]) => s.wrong > 0)
      .map(([qid, s]) => {
        const q = QUESTIONS.find(x => x.id === qid);
        return q ? {
          id: qid,
          day: q.day,
          topic: q.topic,
          stem: q.stem,
          correctAnswer: q.options[q.answer],
          attempts: s.attempts,
          wrong: s.wrong,
          correct: s.correct,
        } : null;
      })
      .filter(Boolean);

    const weakVocab = Object.entries(state.vocabStats)
      .filter(([w, s]) => (s.mastery || 0) < 3 && s.seen > 0)
      .map(([w, s]) => {
        const v = VOCABULARY[w];
        return {
          word: w,
          zh: v?.zh || '',
          mastery: s.mastery,
          seen: s.seen,
          correct: s.correct,
          wrong: s.wrong,
        };
      })
      .sort((a, b) => a.mastery - b.mastery);

    const masteredVocab = Object.entries(state.vocabStats)
      .filter(([w, s]) => (s.mastery || 0) >= 4)
      .map(([w]) => w);

    const topicConfidence = Object.entries(state.topicStats).map(([t, s]) => ({
      topic: t,
      title: GRAMMAR_LESSONS[t]?.title || (t === 'vocab' ? '單字辨識' : t === 'mixed' ? '時態綜合' : t),
      confidence: s.confidence,
      correct: s.correct,
      wrong: s.wrong,
    })).sort((a, b) => a.confidence - b.confidence);

    return {
      generatedAt: new Date().toISOString(),
      summary: {
        startDate: state.startDate,
        currentDay: state.currentDay,
        streak: state.streak,
        sessionsCompleted: state.history.length,
        totalCorrect: state.history.reduce((s, h) => s + h.correct, 0),
        totalAttempted: state.history.reduce((s, h) => s + h.total, 0),
        masteredVocabCount: masteredVocab.length,
        seenVocabCount: Object.keys(state.vocabStats).length,
        currentReviewQueueSize: (state.reviewQueue || []).length,
      },
      lastSession: recentSession || null,
      recentHistory: allHistory,
      topicConfidence,
      weakVocab,
      wrongQuestions,
    };
  }

  function formatTutorReportText(report) {
    const lines = [];
    lines.push('=== 多益學習進度回報 (TOEIC Progress Report) ===');
    lines.push(`匯出時間: ${new Date(report.generatedAt).toLocaleString('zh-TW')}`);
    lines.push('');
    lines.push('【總覽】');
    lines.push(`- 起始日期: ${report.summary.startDate}`);
    lines.push(`- 目前 Day: ${report.summary.currentDay}`);
    lines.push(`- 連續學習: ${report.summary.streak} 天`);
    lines.push(`- 完成課程數: ${report.summary.sessionsCompleted}`);
    lines.push(`- 累計答題: ${report.summary.totalCorrect} / ${report.summary.totalAttempted}`);
    lines.push(`- 已掌握單字: ${report.summary.masteredVocabCount} / ${report.summary.seenVocabCount}`);
    lines.push(`- 待複習題: ${report.summary.currentReviewQueueSize} 題`);
    lines.push('');
    if (report.lastSession) {
      const ls = report.lastSession;
      lines.push('【最近一次課程】');
      lines.push(`- 日期: ${ls.date} · Day ${ls.day}`);
      lines.push(`- 答對: ${ls.correct} / ${ls.total} (${Math.round(ls.correct / ls.total * 100)}%)`);
      lines.push('');
    }
    if (report.topicConfidence.length > 0) {
      lines.push('【觀念信心度】');
      report.topicConfidence.forEach(t => {
        lines.push(`- ${t.title}: ${t.confidence}% (對 ${t.correct} / 錯 ${t.wrong})`);
      });
      lines.push('');
    }
    if (report.weakVocab.length > 0) {
      lines.push('【還不熟的單字】');
      report.weakVocab.forEach(v => {
        lines.push(`- ${v.word} (${v.zh}) · 熟練度 ${v.mastery}/5 · 對 ${v.correct} 錯 ${v.wrong}`);
      });
      lines.push('');
    }
    if (report.wrongQuestions.length > 0) {
      lines.push('【曾答錯的題目】');
      report.wrongQuestions.forEach(q => {
        lines.push(`- [Day ${q.day} · ${q.topic}] ${q.stem}`);
        lines.push(`  正解: ${q.correctAnswer} · 答錯 ${q.wrong} 次 / 嘗試 ${q.attempts} 次`);
      });
      lines.push('');
    }
    lines.push('=== 請把以上完整訊息貼給家教，會根據資料調整下一階段教材 ===');
    return lines.join('\n');
  }

  async function shareReport(state) {
    const report = buildTutorReport(state);

    // Try iOS native share sheet first

      try {
        await navigator.share({ title: '多益學習進度回報', text });
        return { ok: true, method: 'share' };
      } catch (err) {
        if (err && err.name === 'AbortError') return { ok: false, method: 'cancel' };
      }
    }
    // Fallback: clipboard
    try {
      await navigator.clipboard.writeText(text);
      return { ok: true, method: 'clipboard' };

      return { ok: false, method: 'manual', text };

  function VocabQuizStep({ session, onNext }) {
    const words = session.vocab || [];

    // 進入時把題目固定下來：每個字配 4 個選項（正確中文 + 3 個同 pool 隨機誘答）
    const questions = useRef(null);
    if (questions.current === null) {
      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const allVocabValues = Object.values(VOCABULARY);
      questions.current = words.map(word => {
        const localPool = words.filter(w => w.word !== word.word);
        let pool = localPool;
        if (pool.length < 3) {
          // 如果今日字數不夠當誘答，補從全部 VOCABULARY 抽
          const extras = allVocabValues.filter(w => w.word !== word.word && !words.find(x => x.word === w.word));
          pool = [...pool, ...shuffle(extras).slice(0, 3 - pool.length)];
        }
        const distractors = shuffle(pool).slice(0, 3).map(w => w.zh);
        const choices = shuffle([word.zh, ...distractors]);
        return { word, choices, answer: choices.indexOf(word.zh) };
      });
    }

    const total = questions.current.length;
    const [idx, setIdx] = useState(0);
    const [selected, setSelected] = useState(null);
    const [revealed, setRevealed] = useState(false);
    const [correctCount, setCorrectCount] = useState(0);
    const [shake, setShake] = useState(false);

    if (total === 0) {
      return (
        <div className="bg-white rounded-3xl shadow-card border border-slate-100 p-8 text-center">
          <p className="text-slate-500 mb-4">今日沒有單字 — 直接進入文法環節</p>

        </div>
      );
    }

    const q = questions.current[idx];
    const isLast = idx === total - 1;

    const submit = (choiceIdx) => {
      if (revealed) return;
      const isCorrect = choiceIdx === q.answer;
      setSelected(choiceIdx);
      setRevealed(true);
      if (isCorrect) {
        setCorrectCount(c => c + 1);
      } else {
        setShake(true); setTimeout(() => setShake(false), 400);
      }
    };

    const goNext = () => {
      if (isLast) {
        onNext();
      } else {
        setIdx(i => i + 1);
        setSelected(null);
        setRevealed(false);
      }
    };

    return (
      <div className={`bg-white rounded-2xl sm:rounded-3xl shadow-card border border-slate-100 p-5 sm:p-8 ${shake ? 'shake' : ''}`}>
        <div className="flex items-center justify-between mb-3 text-sm">
          <div className="text-slate-500 text-xs sm:text-sm">單字抽考 <span className="font-bold text-slate-800">{idx + 1}</span> / {total}</div>
          <div className="text-xs text-emerald-600 font-medium">答對 {correctCount}</div>
        </div>

        <div className="mb-5 sm:mb-6 h-1.5 bg-slate-200 rounded-full overflow-hidden">
          <div className="h-full bg-brand-500 progress-bar" style={{ width: `${((idx+1)/total)*100}%` }}></div>
        </div>

        <div className="text-center mb-5 sm:mb-6">
          <div className="text-3xl sm:text-4xl font-black text-slate-800 mb-1 break-words">{q.word.word}</div>
          <div className="ipa text-slate-500 text-xs sm:text-sm mb-3">{q.word.ipa} <span className="text-slate-400">· {q.word.pos}</span></div>
          <button onClick={() => speak(q.word.word)} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-slate-200 active:bg-brand-50 hover:border-brand-300 hover:text-brand-700 transition text-sm font-medium shadow-sm">
            🔊 聽發音
          </button>
        </div>

        <div className="space-y-2.5 sm:space-y-3 mb-5">
          {q.choices.map((opt, i) => {
            const isSelected = selected === i;
            const isCorrect = i === q.answer;
            let cls = 'border-slate-200 active:border-brand-300 hover:border-brand-300 bg-white';
            if (revealed) {
              if (isCorrect) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900';
              else if (isSelected) cls = 'border-rose-500 bg-rose-50 text-rose-900';
              else cls = 'border-slate-200 bg-white opacity-60';
            }
            return (
              <button key={i}
                onClick={() => submit(i)}
                disabled={revealed}
                className={`w-full text-left p-3.5 sm:p-4 rounded-xl border-2 font-medium text-sm sm:text-base ${cls} transition`}>
                <div className="flex items-center gap-3">
                  <div className={`w-8 h-8 rounded-full grid place-items-center text-sm font-bold flex-shrink-0 ${revealed && isCorrect ? 'bg-emerald-500 text-white' : revealed && isSelected ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                    {String.fromCharCode(65 + i)}
                  </div>
                  <div className="flex-1">{opt}</div>
                  {revealed && isCorrect && <span className="text-emerald-600 font-bold">✓</span>}
                  {revealed && isSelected && !isCorrect && <span className="text-rose-600 font-bold">✗</span>}
                </div>
              </button>
            );
          })}
        </div>

        {revealed && (
          <div className="rounded-xl p-3 sm:p-4 mb-2 bg-slate-50 border border-slate-200 fade-up">
            <div className="text-xs text-slate-500 font-medium mb-1">例句</div>
            <div className="flex items-start gap-2">
              <div className="text-sm text-slate-700 leading-relaxed flex-1">{q.word.example}</div>
              <button
                onClick={() => speak(q.word.example)}
                className="flex-shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 active:bg-brand-50 hover:border-brand-300 grid place-items-center text-sm transition"
                aria-label="播放例句">
                🔊
              </button>
            </div>
            <div className="text-xs text-slate-500 mt-1">{q.word.exampleZh}</div>
          </div>
        )}

        <div className="sticky-actions mt-4">
          {revealed && (
            <button onClick={goNext} className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition text-sm sm:text-base">
              {isLast ? `完成抽考（${correctCount} / ${total}）→ 學文法` : '下一題 →'}
            </button>
          )}
        </div>
      </div>
    );
  }

  function GrammarStep({ session, onNext }) {
    const [idx, setIdx] = useState(0);
    const lesson = session.grammar[idx];
    const isLast = idx === session.grammar.length - 1;

    if (!lesson) {
      return (
        <div className="bg-white rounded-3xl shadow-card border border-slate-100 p-8 text-center">
          <p className="text-slate-500 mb-4">今日沒有新文法 — 直接進入練習</p>
          <button onClick={onNext} className="px-6 py-3 rounded-xl bg-brand-600 text-white font-bold">繼續 →</button>
        </div>
      );
    }

    return (
      <div className="bg-white rounded-2xl sm:rounded-3xl shadow-card border border-slate-100 overflow-hidden">
        <div className="bg-gradient-to-r from-brand-600 to-indigo-700 text-white p-5 sm:p-6">
          <div className="text-xs font-bold text-brand-200 mb-1">文法 {idx + 1} / {session.grammar.length}</div>
          <h2 className="text-xl sm:text-2xl font-black leading-tight">{lesson.title}</h2>
          <p className="text-brand-100 text-xs sm:text-sm mt-1">{lesson.summary}</p>
        </div>
        <div className="p-5 sm:p-8 space-y-5 sm:space-y-6 overflow-y-auto scrollbar-thin">
          {lesson.sections.map((sec, i) => (
            <div key={i} className="fade-up">
              <h3 className="font-bold text-slate-800 mb-3 flex items-center gap-2 text-sm sm:text-base">
                <span className="w-6 h-6 rounded-full bg-brand-100 text-brand-700 grid place-items-center text-xs flex-shrink-0">{i+1}</span>
                {sec.heading}
              </h3>
              <div className="text-slate-700 prose prose-sm max-w-none text-sm sm:text-base" dangerouslySetInnerHTML={{ __html: sec.html }} />
            </div>
          ))}
        </div>
        <div className="p-4 sm:p-6 border-t border-slate-100 flex justify-between gap-2 safe-bottom">
          <button
            onClick={() => idx > 0 ? setIdx(i => i - 1) : null}
            disabled={idx === 0}
            className="px-4 sm:px-5 py-3 text-slate-500 active:text-slate-800 hover:text-slate-800 disabled:opacity-30 transition text-sm">
            ← 上一個
          </button>
          {isLast ? (
            <button onClick={onNext} className="px-6 py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft text-sm sm:text-base">進入練習 →</button>
          ) : (
            <button onClick={() => setIdx(i => i + 1)} className="px-6 py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft text-sm sm:text-base">下一個 →</button>
          )}
        </div>
      </div>
    );
  }

  function PracticeStep({ session, state, setState, onComplete }) {
    const [idx, setIdx] = useState(0);
    const [selected, setSelected] = useState(null);
    const [revealed, setRevealed] = useState(false);
    const [results, setResults] = useState([]);
    const [shake, setShake] = useState(false);
    const startTime = useRef(Date.now());
    // 把題目陣列固定下來：答題過程中 reviewQueue 會變動，
    // 若直接讀 session.questions，最後一題答對後它會從 reviewQueue 被移除，
    // 導致 idx 超出陣列、誤觸「沒題目」分支。
    const questions = useRef(session.questions);

    const q = questions.current[idx];
    const total = questions.current.length;
    const isLast = idx === total - 1;

    if (!q) {
      return (
        <div className="bg-white rounded-3xl shadow-card border border-slate-100 p-8 text-center">
          <p>今日沒有題目 — 直接結算</p>
          <button onClick={() => onComplete({ correct: 0, total: 0, results: [] })} className="px-6 py-3 mt-3 rounded-xl bg-brand-600 text-white font-bold">繼續 →</button>
        </div>
      );
    }

    const submit = () => {
      if (selected == null) return;
      const isCorrect = selected === q.answer;
      if (!isCorrect) { setShake(true); setTimeout(() => setShake(false), 400); }
      setRevealed(true);
      setState(prev => applyAnswerOutcome(prev, q, isCorrect));
      setResults(r => [...r, { qId: q.id, correct: isCorrect, selected }]);
    };

    const goNext = () => {
      if (isLast) {
        const correct = results.filter(r => r.correct).length;
        onComplete({ correct, total: results.length, results, durationSec: Math.round((Date.now() - startTime.current) / 1000) });
      } else {
        setIdx(i => i + 1);
        setSelected(null);
        setRevealed(false);
      }
    };

    const isReviewQ = !questions.current.slice(0, total - (session.reviewQuestionCount || 0)).find(qq => qq.id === q.id);

    return (
      <div className={`bg-white rounded-2xl sm:rounded-3xl shadow-card border border-slate-100 p-5 sm:p-8 ${shake ? 'shake' : ''}`}>
        <div className="flex items-center justify-between mb-3 text-sm">
          <div className="text-slate-500 text-xs sm:text-sm">題目 <span className="font-bold text-slate-800">{idx + 1}</span> / {total}</div>
          {isReviewQ && (
            <div className="px-2 py-1 bg-amber-50 text-amber-700 rounded-full text-xs font-medium border border-amber-200">📌 複習題</div>
          )}
        </div>

        <div className="mb-5 sm:mb-6 h-1.5 bg-slate-200 rounded-full overflow-hidden">
          <div className="h-full bg-brand-500 progress-bar" style={{ width: `${((idx+1)/total)*100}%` }}></div>
        </div>

        <div className="text-base sm:text-xl font-semibold text-slate-800 leading-relaxed mb-5 sm:mb-6 min-h-[3rem]">
          {q.stem.split('______').map((part, i, arr) => (
            <React.Fragment key={i}>
              {part}
              {i < arr.length - 1 && <span className="inline-block min-w-[60px] sm:min-w-[80px] border-b-2 border-brand-400 mx-1 align-middle"></span>}
            </React.Fragment>
          ))}
        </div>

        <div className="space-y-2.5 sm:space-y-3 mb-5">
          {q.options.map((opt, i) => {
            const isSelected = selected === i;
            const isCorrect = i === q.answer;
            let cls = 'border-slate-200 active:border-brand-300 hover:border-brand-300 bg-white';
            if (revealed) {
              if (isCorrect) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900';
              else if (isSelected) cls = 'border-rose-500 bg-rose-50 text-rose-900';
              else cls = 'border-slate-200 bg-white opacity-60';
            } else if (isSelected) {
              cls = 'border-brand-500 bg-brand-50 text-brand-900';
            }
            return (
              <button key={i}
                onClick={() => !revealed && setSelected(i)}
                disabled={revealed}
                className={`option-btn w-full text-left p-3.5 sm:p-4 rounded-xl border-2 font-medium text-sm sm:text-base ${cls}`}>
                <div className="flex items-center gap-3">
                  <div className={`w-8 h-8 rounded-full grid place-items-center text-sm font-bold flex-shrink-0 ${revealed && isCorrect ? 'bg-emerald-500 text-white' : revealed && isSelected ? 'bg-rose-500 text-white' : isSelected ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                    {String.fromCharCode(65 + i)}
                  </div>
                  <div className="flex-1">{opt}</div>
                  {revealed && isCorrect && <span className="text-emerald-600 font-bold">✓</span>}
                  {revealed && isSelected && !isCorrect && <span className="text-rose-600 font-bold">✗</span>}
                </div>
              </button>
            );
          })}
        </div>

        {revealed && q.stemZh && (
          <div className="rounded-xl p-3 sm:p-4 mb-2 bg-slate-50 border border-slate-200 fade-up">
            <div className="text-xs text-slate-500 font-medium mb-1">題目翻譯</div>
            <div className="flex items-start gap-2">
              <div className="text-sm text-slate-700 leading-relaxed flex-1">{q.stemZh}</div>
              <button
                onClick={() => speak(q.stem.replace(/_+/g, q.options[q.answer]))}
                className="flex-shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 active:bg-brand-50 hover:border-brand-300 grid place-items-center text-sm transition"
                aria-label="播放完整題目">
                🔊
              </button>
            </div>
          </div>
        )}

        {revealed && (
          <div className={`rounded-xl p-4 mb-2 fade-up ${selected === q.answer ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}`}>
            <div className="font-bold mb-1 text-sm sm:text-base">
              {selected === q.answer ? '✅ 答對！' : '❌ 答錯了，沒關係'}
            </div>
            <div className="text-sm text-slate-700 leading-relaxed">{q.explain}</div>
            {q.vocab && q.vocab.length > 0 && (
              <div className="mt-2 text-xs text-slate-500">
                相關單字：{q.vocab.map(w => VOCABULARY[w]?.word || w).join(', ')}
              </div>
            )}
          </div>
        )}

        <div className="sticky-actions mt-4">
          {!revealed ? (
            <button onClick={submit} disabled={selected == null}
              className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft disabled:opacity-40 disabled:cursor-not-allowed transition text-sm sm:text-base">
              送出答案
            </button>
          ) : (
            <button onClick={goNext} className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition text-sm sm:text-base">
              {isLast ? '查看結果' : '下一題'} →
            </button>
          )}
        </div>
      </div>
    );
  }

  function ResultStep({ session, state, onExit }) {
    const last = state.history[state.history.length - 1];
    if (!last) return null;
    const accuracy = Math.round((last.correct / last.total) * 100);
    const minutes = Math.floor((last.durationSec || 0) / 60);
    const seconds = (last.durationSec || 0) % 60;

    let verdict, verdictColor, advice;
    if (accuracy >= 87) { verdict = '太棒了！👏'; verdictColor = 'emerald'; advice = '觀念清楚，明天可以直接進度到下一個主題。'; }
    else if (accuracy >= 67) { verdict = '及格了！'; verdictColor = 'brand'; advice = '把錯的題目再看一次詳解，明天會看到部分複習。'; }
    else if (accuracy >= 47) { verdict = '需要再多練習'; verdictColor = 'amber'; advice = '建議再看一次今天的文法，明天的課會包含更多今日題型的複習。'; }
    else { verdict = '別氣餒，慢慢來'; verdictColor = 'rose'; advice = '把整份文法重讀一遍。明天會以複習為主，鞏固觀念再前進。'; }

    const colorMap = {
      emerald: 'from-emerald-500 to-green-600',
      brand: 'from-brand-600 to-indigo-700',
      amber: 'from-amber-500 to-orange-600',
      rose: 'from-rose-500 to-pink-600',
    };

    // Show weak items that will be reinforced
    const weakWords = (session.vocab || []).filter(w => {
      const v = state.vocabStats[w.word];
      return v && v.mastery < 3;
    }).slice(0, 5);

    const weakTopics = Object.entries(state.topicStats)
      .filter(([_, s]) => s.confidence < 70 && s.wrong > 0)
      .sort((a, b) => a[1].confidence - b[1].confidence)
      .slice(0, 3);

    return (
      <div className="space-y-4 sm:space-y-6 fade-up safe-bottom">
        <div className={`rounded-2xl sm:rounded-3xl p-6 sm:p-8 bg-gradient-to-br ${colorMap[verdictColor]} text-white shadow-card`}>
          <div className="text-xs sm:text-sm opacity-90 mb-1">Day {last.day} 完成</div>
          <h2 className="text-2xl sm:text-3xl font-black mb-1">{verdict}</h2>
          <p className="opacity-90 mb-5 sm:mb-6 text-sm sm:text-base">{advice}</p>
          <div className="grid grid-cols-3 gap-2 sm:gap-4">
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">答對</div>
              <div className="text-lg sm:text-2xl font-black">{last.correct}<span className="text-xs sm:text-sm font-medium opacity-70"> /{last.total}</span></div>
            </div>
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">準確率</div>
              <div className="text-lg sm:text-2xl font-black">{accuracy}<span className="text-xs sm:text-sm font-medium opacity-70">%</span></div>
            </div>
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">用時</div>
              <div className="text-lg sm:text-2xl font-black">{minutes}<span className="text-xs sm:text-sm font-medium opacity-70">分</span>{seconds}<span className="text-xs sm:text-sm font-medium opacity-70">秒</span></div>
            </div>
          </div>
        </div>

        <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-slate-100">
          <h3 className="font-bold text-slate-800 mb-1">🔁 系統將在下次課程中強化這些</h3>
          <p className="text-sm text-slate-500 mb-4">適應性引擎已根據你今天的表現調整接下來的內容</p>
          <div className="space-y-4">
            {weakTopics.length > 0 && (
              <div>
                <div className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">弱點觀念</div>
                <div className="space-y-2">
                  {weakTopics.map(([topic, s]) => (
                    <div key={topic} className="flex items-center gap-3">
                      <div className="text-sm font-medium text-slate-700 w-44 truncate">
                        {GRAMMAR_LESSONS[topic]?.title || (topic === 'vocab' ? '單字辨識' : topic === 'mixed' ? '時態綜合' : topic)}
                      </div>
                      <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div className={`h-full progress-bar ${s.confidence < 40 ? 'bg-rose-500' : 'bg-amber-500'}`} style={{ width: `${s.confidence}%` }}></div>
                      </div>
                      <div className="text-xs font-semibold text-slate-500">{s.confidence}%</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {weakWords.length > 0 && (
              <div>
                <div className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">需要再複習的單字</div>
                <div className="flex flex-wrap gap-2">
                  {weakWords.map(w => (
                    <span key={w.word} className="px-3 py-1 bg-amber-50 border border-amber-200 text-amber-800 rounded-full text-sm">
                      {w.word} <span className="opacity-60">{w.zh}</span>
                    </span>
                  ))}
                </div>
              </div>
            )}
            {weakTopics.length === 0 && weakWords.length === 0 && (
              <div className="text-sm text-slate-500">沒有明顯弱點 — 你今天表現很穩定！🎉</div>
            )}
          </div>
        </div>

        <TutorReportButton state={state} primary />

        <div className="text-center">
          <button onClick={onExit} className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-white border-2 border-slate-200 active:bg-slate-50 hover:border-slate-300 text-slate-700 font-bold transition">
            回到首頁
          </button>
        </div>
      </div>
    );
  }

  // ============================================================
  //  QUIZ FLOW — random vocabulary test
  // ============================================================

  function QuizFlow({ state, setState, onExit, initialCount }) {
    const [phase, setPhase] = useState('setup');
    const [questions, setQuestions] = useState([]);
    const [idx, setIdx] = useState(0);
    const [selected, setSelected] = useState(null);
    const [revealed, setRevealed] = useState(false);
    const [results, setResults] = useState([]);
    const startTime = useRef(0);

    const pool = getQuizPool(state);
    const startQuiz = (count) => {
      const qs = generateQuiz(state, Math.min(count, pool.length));
      if (qs.length < 1) return;
      setQuestions(qs);
      setIdx(0);
      setSelected(null);
      setRevealed(false);
      setResults([]);
      startTime.current = Date.now();
      setPhase('play');
    };

    // Auto-start when initialCount is provided (from suggestion modal)
    useEffect(() => {
      if (initialCount && phase === 'setup' && questions.length === 0 && pool.length >= 4) {
        startQuiz(initialCount);
      }
    }, []);

    if (phase === 'setup') {
      const enough = pool.length >= 4;
      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-5 py-5 sm:py-8 fade-up safe-bottom">
          <div className="bg-white rounded-2xl sm:rounded-3xl shadow-card border border-slate-100 p-5 sm:p-8">
            <div className="text-center mb-6">
              <div className="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-amber-400 to-orange-500 grid place-items-center text-3xl mb-3 shadow-soft">🎯</div>
              <h2 className="text-2xl font-black text-slate-800 mb-1">單字隨機抽考</h2>
              <p className="text-sm text-slate-500">從你已學過的 <b className="text-brand-700">{pool.length}</b> 個單字中隨機出題</p>
              <p className="text-xs text-slate-400 mt-1">不熟的單字會更常被抽到</p>
            </div>

            {!enough ? (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900">
                還需要至少 <b>4 個</b>已學過的單字才能開始抽考。先把 Day 1 的單字過一遍吧！
              </div>
            ) : (
              <div className="space-y-3">
                <div className="text-sm font-bold text-slate-700 mb-2">選擇題數</div>
                <div className="grid grid-cols-3 gap-2 sm:gap-3">
                  {[5, 10, 20].map(n => {
                    const disabled = n > pool.length;
                    return (
                      <button key={n} onClick={() => !disabled && startQuiz(n)}
                        disabled={disabled}
                        className={`py-4 rounded-xl font-bold text-lg border-2 transition active:scale-[0.97] ${disabled ? 'border-slate-200 text-slate-300 bg-slate-50 cursor-not-allowed' : 'border-brand-200 text-brand-700 bg-brand-50 hover:bg-brand-100 active:bg-brand-100'}`}>
                        {n} 題
                      </button>
                    );
                  })}
                </div>
                <button onClick={() => startQuiz(pool.length)}
                  className="w-full mt-3 py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition">
                  全部 {pool.length} 個都考
                </button>
              </div>
            )}
          </div>
          <div className="text-center mt-4">
            <button onClick={onExit} className="text-slate-500 active:text-slate-800 hover:text-slate-800 transition py-3 px-5 text-sm">← 返回首頁</button>
          </div>
        </div>
      );
    }

    if (phase === 'play') {
      const q = questions[idx];
      const total = questions.length;
      const isLast = idx === total - 1;
      const submit = () => {
        if (selected == null) return;
        const isCorrect = selected === q.answer;
        setRevealed(true);
        setState(prev => applyQuizAnswer(prev, q, isCorrect));
        setResults(r => [...r, { word: q.word, direction: q.direction, correct: isCorrect, selected }]);
      };
      const goNext = () => {
        if (isLast) {
          setState(prev => ({ ...prev, lastQuizDate: todayStr() }));
          setPhase('result');
        } else {
          setIdx(i => i + 1);
          setSelected(null);
          setRevealed(false);
        }
      };
      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-5 py-5 sm:py-8 fade-up safe-bottom">
          <div className="bg-white rounded-2xl sm:rounded-3xl shadow-card border border-slate-100 p-5 sm:p-8">
            <div className="flex items-center justify-between mb-3 text-xs sm:text-sm">
              <div className="text-slate-500">抽考 <span className="font-bold text-slate-800">{idx + 1}</span> / {total}</div>
              <div className={`px-2 py-1 rounded-full text-xs font-medium ${q.direction === 'enToZh' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-violet-50 text-violet-700 border border-violet-200'}`}>
                {q.direction === 'enToZh' ? '英 → 中' : '中 → 英'}
              </div>
            </div>
            <div className="mb-5 sm:mb-6 h-1.5 bg-slate-200 rounded-full overflow-hidden">
              <div className="h-full bg-amber-500 progress-bar" style={{ width: `${((idx+1)/total)*100}%` }}></div>
            </div>

            <div className="text-center py-4 sm:py-6">
              <div className="text-3xl sm:text-5xl font-black text-slate-800 mb-2 break-words">{q.prompt}</div>
              <div className="text-xs sm:text-sm text-slate-500 mb-3">{q.promptHint}</div>
              {q.direction === 'enToZh' && (
                <button onClick={() => speak(q.prompt)} className="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-white border border-slate-200 active:bg-brand-50 hover:border-brand-300 text-sm">
                  🔊 聽發音
                </button>
              )}
            </div>

            <div className="space-y-2.5 mb-5">
              {q.options.map((opt, i) => {
                const isSelected = selected === i;
                const isCorrect = i === q.answer;
                let cls = 'border-slate-200 active:border-brand-300 hover:border-brand-300 bg-white';
                if (revealed) {
                  if (isCorrect) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                  else if (isSelected) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                  else cls = 'border-slate-200 bg-white opacity-60';
                } else if (isSelected) {
                  cls = 'border-brand-500 bg-brand-50 text-brand-900';
                }
                return (
                  <button key={i}
                    onClick={() => !revealed && setSelected(i)}
                    disabled={revealed}
                    className={`option-btn w-full text-left p-3.5 sm:p-4 rounded-xl border-2 font-medium text-sm sm:text-base ${cls}`}>
                    <div className="flex items-center gap-3">
                      <div className={`w-8 h-8 rounded-full grid place-items-center text-sm font-bold flex-shrink-0 ${revealed && isCorrect ? 'bg-emerald-500 text-white' : revealed && isSelected ? 'bg-rose-500 text-white' : isSelected ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                        {String.fromCharCode(65 + i)}
                      </div>
                      <div className="flex-1">{opt}</div>
                      {revealed && isCorrect && <span className="text-emerald-600 font-bold">✓</span>}
                      {revealed && isSelected && !isCorrect && <span className="text-rose-600 font-bold">✗</span>}
                    </div>
                  </button>
                );
              })}
            </div>

            {revealed && (() => {
              const v = VOCABULARY[q.word];
              return (
                <div className={`rounded-xl p-4 mb-2 fade-up ${selected === q.answer ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}`}>
                  <div className="font-bold mb-1 text-sm sm:text-base">
                    {selected === q.answer ? '✅ 答對！' : '❌ 答錯了'}
                  </div>
                  <div className="text-sm text-slate-700">
                    <b>{v.word}</b> {v.ipa} · {v.pos} = <b>{v.zh}</b>
                  </div>
                  <div className="text-xs text-slate-500 mt-1 leading-relaxed">{v.example}<br/>{v.exampleZh}</div>
                </div>
              );
            })()}

            <div className="sticky-actions mt-3">
              {!revealed ? (
                <button onClick={submit} disabled={selected == null}
                  className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft disabled:opacity-40 disabled:cursor-not-allowed transition">
                  送出答案
                </button>
              ) : (
                <button onClick={goNext} className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition">
                  {isLast ? '查看結果' : '下一題'} →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // result phase
    const correct = results.filter(r => r.correct).length;
    const total = results.length;
    const accuracy = total ? Math.round(correct / total * 100) : 0;
    const wrongWords = results.filter(r => !r.correct).map(r => VOCABULARY[r.word]).filter(Boolean);
    const elapsed = Math.round((Date.now() - startTime.current) / 1000);
    return (
      <div className="max-w-3xl mx-auto px-4 sm:px-5 py-5 sm:py-8 space-y-4 fade-up safe-bottom">
        <div className={`rounded-2xl sm:rounded-3xl p-6 sm:p-8 bg-gradient-to-br ${accuracy >= 80 ? 'from-emerald-500 to-green-600' : accuracy >= 60 ? 'from-brand-600 to-indigo-700' : 'from-amber-500 to-orange-600'} text-white shadow-card`}>
          <div className="text-xs opacity-90 mb-1">隨機抽考完成</div>
          <h2 className="text-2xl sm:text-3xl font-black mb-3">{accuracy >= 80 ? '🌟 表現很棒！' : accuracy >= 60 ? '繼續加油' : '需要再多練習'}</h2>
          <div className="grid grid-cols-3 gap-2 sm:gap-4">
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">答對</div>
              <div className="text-lg sm:text-2xl font-black">{correct}<span className="text-xs sm:text-sm font-medium opacity-70"> /{total}</span></div>
            </div>
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">準確率</div>
              <div className="text-lg sm:text-2xl font-black">{accuracy}<span className="text-xs sm:text-sm font-medium opacity-70">%</span></div>
            </div>
            <div className="bg-white/10 rounded-xl p-3 sm:p-4">
              <div className="text-[10px] sm:text-xs opacity-80 mb-1">用時</div>
              <div className="text-lg sm:text-2xl font-black">{Math.floor(elapsed/60)}<span className="text-xs sm:text-sm font-medium opacity-70">分</span>{elapsed%60}<span className="text-xs sm:text-sm font-medium opacity-70">秒</span></div>
            </div>
          </div>
        </div>

        {wrongWords.length > 0 && (
          <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-slate-100">
            <h3 className="font-bold text-slate-800 mb-1">❌ 答錯的單字</h3>
            <p className="text-xs text-slate-500 mb-3">這些字會在後續課程更常出現</p>
            <div className="space-y-2">
              {wrongWords.map(v => (
                <div key={v.word} className="flex items-center justify-between p-3 rounded-lg bg-rose-50 border border-rose-100">
                  <div>
                    <div className="font-bold text-rose-900">{v.word}</div>
                    <div className="text-xs text-slate-500">{v.ipa} · {v.zh}</div>
                  </div>
                  <button onClick={() => speak(v.word)} className="text-rose-600 active:scale-90 px-2 py-1 text-sm">🔊</button>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="grid grid-cols-2 gap-3">
          <button onClick={() => setPhase('setup')} className="py-3.5 rounded-xl bg-white border-2 border-slate-200 active:bg-slate-50 hover:border-slate-300 text-slate-700 font-bold transition">
            再考一次
          </button>
          <button onClick={onExit} className="py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition">
            回首頁
          </button>
        </div>
      </div>
    );
  }

  function SuggestionModal({ suggestion, onAccept, onDismiss }) {
    return (
      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm fade-up p-4 safe-bottom" onClick={onDismiss}>
        <div className="w-full max-w-md bg-white rounded-3xl shadow-card overflow-hidden" onClick={e => e.stopPropagation()}>
          <div className={`p-6 sm:p-7 bg-gradient-to-br ${suggestion.gradient} text-white`}>
            <div className="text-5xl mb-3">{suggestion.icon}</div>
            <h2 className="text-2xl font-black mb-1 leading-tight">{suggestion.title}</h2>
            <p className="opacity-90 text-sm sm:text-base">{suggestion.subtitle}</p>
          </div>
          <div className="p-5 sm:p-6 space-y-3">
            <p className="text-slate-600 text-sm sm:text-base">{suggestion.message}</p>
            <button onClick={onAccept} className="w-full py-3.5 rounded-xl bg-brand-600 active:scale-[0.98] hover:bg-brand-700 text-white font-bold shadow-soft transition">
              {suggestion.primaryLabel}
            </button>
            <button onClick={onDismiss} className="w-full py-3 text-slate-500 active:text-slate-800 hover:text-slate-800 transition text-sm">
              稍後再說
            </button>
          </div>
        </div>
      </div>
    );
  }

  function TutorReportButton({ state, primary }) {
    const [status, setStatus] = useState(null); // 'sharing' | 'copied' | 'manual' | 'error'
    const [manualText, setManualText] = useState('');
    const ref = useRef(null);

    const onClick = async () => {
      setStatus('sharing');
      const result = await shareReport(state);
      if (result.ok && result.method === 'share') setStatus('shared');
      else if (result.ok && result.method === 'clipboard') setStatus('copied');
      else if (result.method === 'cancel') setStatus(null);
      else { setManualText(result.text || formatTutorReportText(buildTutorReport(state))); setStatus('manual'); }
    };

    return (
      <div className={primary ? 'bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-slate-100' : ''}>
        {primary && (
          <div className="mb-3">
            <h3 className="font-bold text-slate-800 mb-1">📤 回報給家教</h3>
            <p className="text-sm text-slate-500">把這次的學習資料一鍵傳給家教，家教會根據你的弱點調整下一輪教材</p>
          </div>
        )}
        <button onClick={onClick} className="w-full py-3.5 rounded-xl bg-emerald-600 active:scale-[0.98] hover:bg-emerald-700 text-white font-bold shadow-soft transition flex items-center justify-center gap-2">
          {status === 'sharing' ? '處理中…' : '📋 一鍵匯出進度給家教'}
        </button>

        {status === 'shared' && (
          <div className="mt-3 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-3 fade-up">
            ✅ 已開啟分享選單。建議傳給「Claude」或複製到家教對話框中。
          </div>
        )}
        {status === 'copied' && (
          <div className="mt-3 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-3 fade-up">
            ✅ 已複製到剪貼簿！打開家教對話貼上即可。
          </div>
        )}
        {status === 'manual' && (
          <div className="mt-3 fade-up">
            <div className="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 mb-2">
              無法自動複製，請長按以下文字選取後複製：
            </div>
            <textarea ref={ref} readOnly value={manualText}
              onFocus={e => e.target.select()}
              className="w-full h-48 p-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-lg" />
          </div>
        )}
      </div>
    );
  }

  // ============================================================
  //  ROOT APP
  // ============================================================

  function App() {
    const [state, setState] = useState(() => loadState());
    const [view, setView] = useState('home'); // 'home' | 'lesson' | 'quiz'
    const [quizPresetCount, setQuizPresetCount] = useState(null);
    const [dismissedSuggestionTypes, setDismissedSuggestionTypes] = useState(new Set());

    // Auto-save on every state change
    useEffect(() => { saveState(state); }, [state]);

    const todaySession = useMemo(() => buildTodaySession(state, state.currentDay), [state]);

    const suggestion = useMemo(() => {
      if (view !== 'home') return null;
      const s = getSuggestion(state);
      if (!s || dismissedSuggestionTypes.has(s.type)) return null;
      return s;
    }, [view, state, dismissedSuggestionTypes]);

    const startLesson = () => setView('lesson');
    const startQuiz = () => { setQuizPresetCount(null); setView('quiz'); };
    const acceptSuggestion = (count) => { setQuizPresetCount(count); setView('quiz'); };
    const dismissSuggestion = (type) => {
      setDismissedSuggestionTypes(prev => { const next = new Set(prev); next.add(type); return next; });
    };
    const goHome = () => setView('home');

    const handleComplete = (result) => {
      setState(prev => recordSessionComplete(prev, todaySession.day, result.correct, result.total, result.durationSec));
    };

    const handleReset = () => {
      if (confirm('確定要清除所有學習進度，重新開始嗎？此動作無法復原。')) {
        const fresh = defaultState();
        setState(fresh);
        saveState(fresh);
        setView('home');
      }
    };

    return (
      <div>
        <Header state={state} onReset={handleReset} onGoHome={goHome} />
        {view === 'home' && (
          <Dashboard state={state} todaySession={todaySession} onStart={startLesson} onStartQuiz={startQuiz} />
        )}
        {view === 'lesson' && (
          <LessonFlow
            session={todaySession}
            state={state}
            setState={setState}
            onComplete={handleComplete}
            onExit={goHome}
          />
        )}
        {view === 'quiz' && (
          <QuizFlow state={state} setState={setState} onExit={goHome} initialCount={quizPresetCount} />
        )}
        {suggestion && (
          <SuggestionModal
            suggestion={suggestion}
            onAccept={() => acceptSuggestion(suggestion.count)}
            onDismiss={() => dismissSuggestion(suggestion.type)}
          />
        )}
        <footer className="max-w-5xl mx-auto px-5 py-8 text-center text-xs text-slate-400">
          學習進度自動儲存於你的瀏覽器 · 為 winne 量身打造 · 6 月達 500 分 / 12 月達 800 分
        </footer>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
